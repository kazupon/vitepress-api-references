allowBuilds:
  esbuild: true
  sharp: true
autoInstallPeers: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
minimumReleaseAgeExclude:
  - '@kazupon/vp-config'
  - '@ox-jsdoc/**'
  - ox-jsdoc
  - '@ox-content/**'
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
